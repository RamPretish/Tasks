name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build -t pavithrasasi9722/cppwindows:3 .
    - name: Push the Docker image
      run: docker push pavithrasasi9722/cppwindows:3
